services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ekep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekep-local}
      POSTGRES_DB: ekep
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekep"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ekep:${POSTGRES_PASSWORD:-ekep-local}@db:5432/ekep
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
